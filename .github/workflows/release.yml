name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: pwsh
        run: |
          $line = Select-String -Path CMakeLists.txt -Pattern 'project\(horus VERSION ([0-9]+\.[0-9]+\.[0-9]+)'
          if (-not $line) { throw 'Could not read the project version.' }
          $version = $line.Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match project version $version."
          }

      - name: Configure x64 release build
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item build/Release/horus.exe,build/Release/horus-cli.exe,build/Release/horus-gui.exe -Destination dist
          $lines = Get-ChildItem dist/*.exe | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          [IO.File]::WriteAllLines((Join-Path $PWD 'dist/SHA256SUMS.txt'), $lines, [Text.Encoding]::ASCII)
          ./tests/release_checks.ps1 -BinDir (Join-Path $PWD 'dist') -ExpectedVersion (($env:GITHUB_REF_NAME).TrimStart('v'))

      - name: Attest release files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/horus.exe
            dist/horus-cli.exe
            dist/horus-gui.exe
            dist/SHA256SUMS.txt

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            dist/horus.exe dist/horus-cli.exe dist/horus-gui.exe dist/SHA256SUMS.txt `
            --verify-tag --latest --title "HORUS $env:GITHUB_REF_NAME" `
            --notes-file build/generated/release-notes.md
